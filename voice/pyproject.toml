[project]
name = "voice-agent"
version = "0.0.1"
description = "Realtime voice agent for the Her ecosystem (LiveKit + Claude + Cartesia/CSM)"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=0.10",
    "livekit-plugins-deepgram>=0.6",
    "livekit-plugins-cartesia>=0.4",
    "livekit-plugins-silero>=0.6",
    "livekit-plugins-anthropic>=0.6",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
csm = [
    # When self-hosting CSM-1B
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=4.45",
    "moshi>=0.2",
]
openai = [
    "livekit-plugins-openai>=0.10",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
