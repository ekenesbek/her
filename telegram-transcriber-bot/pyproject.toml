[project]
name = "telegram-transcriber-bot"
version = "0.1.0"
description = "Telegram bot that transcribes forwarded audio through a Her transcription endpoint."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=21.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
telegram-transcriber-bot = "telegram_transcriber_bot.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telegram_transcriber_bot"]

[tool.ruff]
line-length = 100
target-version = "py311"
